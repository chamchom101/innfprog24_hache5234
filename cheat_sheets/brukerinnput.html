<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for brukerinput</title>
</head>
<style>

    section {
       max-width: 600px;
       margin: 1rem auto;
       box-sizing: border-box;
       padding: 1rem;
       border: 1px dotted #ccc;
    }
</style>
<body>  

    <section>

    <button onclick="showMessage()" id="vismelding">Klikk meg</button>

    </section>

    <section>
    <form onsubmit="logName()">
        <input type="text" name="firstname" id="firstname" placeholder="Firstname">
        <button type="submit">Lagre</button>
    </form>

    </section>

    <section>

    <form id="lastnameForm">
        <input type="text" name="lastname" id="lastname" placeholder="Lastname">
        <button type="submit">Lagre</button>

    </form>
    </section>

    <section>
        <h2>addEventListner: Click</h2>
        <input type="number" id="birthyear" name="birthyear">
        <button id="callCalculate">Regn ut alder</button>
    </section>

    <section>
        <h2>addEventListner: input</h2>
        <input type="number" name="birthyearLive" id="birthyearLive">
        <p>Du er <span id="ageLive"></span> hvis du er født i <span id="birthyearLivePrint"></span></p>
    </section>
    

    <script>
        function showMessage() {

            alert("Au, ikke klikk på meg")
        }

        //Funksjon som kalles når skjema sendes inn
        function logName() {
            const inputFirstname = document.getElementById("firstname").value
            console.log(inputFirstname)
        }

        //Funksjon som kjøres når vi merker brukerhendelsen submit på skjema med id lastnameform
        document.getElementById("lastnameForm").addEventListener("submit", function(event) {

            event.preventDefault()
            console.log(event)
            const inputLastname = document.getElementById("lastname").value
            console.log(inputLastname)

        })

        //EventListener som sjekker etter klikk på HTML-element med id callCalculate
        document.getElementById("callCalculate").addEventListener("click", function(e) {
            const birthyear = document.getElementById("birthyear").value
            console.log(birthyear)
            const age = 2026 - birthyear
            alert(`Du er ${age} år gammel hvis du er født i ${birthyear}`)
        })

        //Eventlistener som sjekker all input i et input-felt. Funksjonen kjøres for hver eneste endring
        document.getElementById("birthyearLive").addEventListener("input", function(e) {

            const birthyearLive = document.getElementById("birthyearLive").value
            const ageLive = 2026 - birthyearLive
            document.getElementById("ageLive").innerHTML = ageLive
            document.getElementById("birthyearLivePrint").innerHTML = birthyearLive
        })

    </script>
</body>
</html>
