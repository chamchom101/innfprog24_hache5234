<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet: Variabler</title>
</head>
<body>

    <h1>Variabler i JavaScript</h1>

    <p>Hei, <span id="name"></span>( <span id="age">?</span> år)</p>

    <h2>Handlekurv</h2>
    <ul>
        <li>Antall produkter: <span id="quantitySpan">0</span></li>
        <li>Pris: <span id="price">0</span> kroner</li>
        <li>Sum: <span id="total">0</span> kroner</li>
    </ul>

    
<script>
    // DEKLARERE VARIABLER
    /* 
    * CONST: deklarere en konstant verdi som ikke skal endres
    * LET:   deklarere en verdi som kan edres
    */

   const firstName = "Hassan";
   console.log(firstName);
   const lastName = "Cherry";
   // Skriv ut firstname verdi til html element til id name:
   // Vi bruker konkatinering, vi slår sammen variabler og tekst, for å skrive ut fornavn + etternavn
   document.getElementById("name").innerHTML = firstName + " " + lastName;

   //DEKLARERE EN VARIABEL FOR ALDER
   const birthYear = 1989;
   let age = 2026 - birthYear;
   document.getElementById("age").innerHTML = age;

   //FORBEREDER HANDLEKURV
   // 3 variabler produkt, pris, SUM

   let antallProdukt = 3
   const pris = 17000
   let sum = pris * antallProdukt



   document.getElementById("quantitySpan").innerHTML = antallProdukt;
   document.getElementById("price").innerHTML = pris;
   document.getElementById("total").innerHTML = sum;


</script>
</body>
</html>
