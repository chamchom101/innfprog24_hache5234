<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for arrays and objects</title>
</head>
<body>

    <h1>Array for book med en forfatter</h1>
    <ul>
        <li>Tittel: <span id="book1TitleSpan"></span></li>
        <li>Forfatter(e): <span id="book1AuthorSpan"></span></li>
        <li>Antall sider: <span id="book1PageCountSpan"></span></li>
    </ul>

    <h1>Array for book med flere forfattere</h1>

      <ul>
        <li>Tittel: <span id="book2TitleSpan"></span></li>
        <li>Forfatter(e): <span id="book2AuthorSpan"></span></li>
        <li>Antall sider: <span id="book2PageCountSpan"></span></li>
    </ul>

    <h1>Object for bok</h1>

    <ul>
        <li>Tittle: <span id="book3TitleSpan"></span></li>
        <li>Forfatter(e): <span id="book3AuthorSpan"></span></li>
        <li>Antall sider: <span id="book3PageCountSpan"></span></li>
    </ul>

    <script>

        //Array med bok med en forfatter
        const book1 = [
            "Fourth wing",
            "Rebecka Yaris",
            512
        ]

        //Array med bok med flere forfattere
        const bok2 = [
            "Silver eyes",
            "Scott Cawthoe",
            "Keira Wristley",
            365
        ]

        //Object med bok
        const bok3 = {

            title: "Harry potter",
            author: "JK Rowling",
            pagecount: 333
        }

        //Print infor fra book1 til html
        document.getElementById("book1TitleSpan").innerHTML = book1[0]
        document.getElementById("book1AuthorSpan").innerHTML = book1[1]
        document.getElementById("book1PageCountSpan").innerHTML = book1[2]

        //Print infor fra book2 til HTML
        document.getElementById("book2TitleSpan").innerHTML = bok2[0]
        document.getElementById("book2AuthorSpan").innerHTML = bok2[1] + ", " + bok2[2]
        document.getElementById("book2PageCountSpan").innerHTML = bok2[3]

        //Print info fra book3 til HTML
        //Book3 er et objekt , vi må derfor referere til nøkler i stedet for indexer
        document.getElementById("book3TitleSpan").innerHTML = bok3.title
        document.getElementById("book3AuthorSpan").innerHTML = bok3.author
        document.getElementById("book3PageCountSpan").innerHTML = bok3.pagecount

    </script>
    
</body>
</html>
