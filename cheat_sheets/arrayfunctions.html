<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for Array Functions</title>
</head>
<body>
    <h1>Array Functions</h1>
    <p>Vi finner antall i en array ved å bruke .length: <span id="arrayCount">0</span></p>
    <p id="toString"></p>
    <p id="join"></p>

    <h2>Array etter slettemetoder er kjørt</h2>
    <p id="deleted"></p>



    <script>
        const books = [
            "Sliver Eyes",
            "Harry potter og de vise sten",
            "Fouth Wing",
            "Bibelen",
            "Nålen",
            "Jævla drittsystem",
            "Dont make me think",
            "Twisted ones",
            "Hunger games",
            "Surrounded by idiots"
        ]

        document.getElementById("arrayCount").innerHTML = books.length

        //Legge til elementer i Array
        //.push(element): Legger inn element på slutten av arrayen
        books.push("Fellowship of the Ring")
        //.unshift(element): Legger inn element i starten av arrayen, og forskyver indexer
        books.unshift("LOTR: Two towers")
        //.splice(index, number of elements modified, element(s))
        //Index: Hvilen index vi starter å manipulerer arrayen på
        //number of element modified: Hvis vi skal slette elementer, hvor mange fra og med
        //startindex (eksempel: hvis )
        books.splice(5, 0, "LORT: Return of the king")


        //.toString(): skriver ut en komasepart liste av en array

        document.getElementById("toString").innerHTML = books.toString()

        document.getElementById("join").innerHTML = books.join(", ")

         //Fjerne elementer fra Array
         //.pop(): Sletter det siste elementet i array
         books.pop()
         //.shift(): Sletter det første elementet i array
         books.shift()
         //Splice(startindex, number of element )
         //books.splice(4, 1)

         //.indexOf(Element): finner det første elementet i arrayen som matcher param element,
         //og returnerer indexen

         const indexFound = books.indexOf("LORT: Return of the king")
         console.log("index til LOTR-bok ", indexFound)
         //Bruke indexOf-verdien i variabelen indexFound til å slette riktig bok:
         books.splice(indexFound, 1)
         // Hvis elementet vi forsøker å finne indexen til ikke finnes, returnerer indexOf -1

         //Hvordan sjekke om en verdi finnes i en array:
         const bookExists = books.includes("Fouth Wing")
         console.log("Finnes Fouth Wings", bookExists)
         
         
         document.getElementById("deleted").innerHTML = books.join(", ")
    </script>
</body>
</html>
